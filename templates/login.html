<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود | CryptoPulse</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.auth-page{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 18% 18%,rgba(103,119,255,.17),transparent 34%),radial-gradient(ellipse at 85% 82%,rgba(49,221,205,.09),transparent 32%),var(--bg)}
.auth-page:before,.auth-page:after{content:"";position:fixed;width:230px;height:230px;border:1px solid #8b9cff20;border-radius:50%;pointer-events:none;z-index:-1}
.auth-page:before{top:-100px;left:-80px;box-shadow:0 0 0 25px #8b9cff08,0 0 0 55px #8b9cff05}
.auth-page:after{bottom:-130px;right:-70px;box-shadow:0 0 0 25px #55e7ff08,0 0 0 55px #55e7ff05}
.auth-card{width:min(100%,420px);position:relative;animation:login-pop .55s ease both}
.auth-card .brand-mark{display:grid;place-items:center}
.auth-card input{direction:rtl}
.auth-card .primary-button{gap:12px}
@keyframes login-pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.water-transition{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#080d18;animation:water-bg .95s ease-in forwards}
.water-transition:before,.water-transition:after,.water-wave{content:"";position:absolute;left:50%;top:50%;width:20vmax;height:20vmax;min-width:180px;min-height:180px;border-radius:43% 57% 61% 39% / 42% 42% 58% 58%;transform:translate(-50%,-50%) scale(.05);background:radial-gradient(circle at 32% 28%,rgba(201,250,255,.98),rgba(85,231,255,.88) 18%,rgba(94,126,255,.76) 48%,rgba(111,88,230,.24) 70%,transparent 72%);filter:drop-shadow(0 0 30px rgba(85,231,255,.3));animation:water-expand .95s cubic-bezier(.15,.7,.2,1) forwards}
.water-transition:after{width:28vmax;height:28vmax;animation-delay:.08s;opacity:.55;background:radial-gradient(circle,transparent 49%,rgba(85,231,255,.7) 50%,rgba(139,156,255,.2) 58%,transparent 68%)}
.water-wave{width:38vmax;height:38vmax;animation-delay:.15s;opacity:.42;background:radial-gradient(circle,transparent 52%,rgba(85,231,255,.55) 53%,transparent 61%)}
.water-label{position:relative;z-index:2;color:#edfaff;font-size:13px;font-weight:700;letter-spacing:.04em;text-shadow:0 0 20px #55e7ff99;animation:label-fade .75s ease both}
@keyframes water-expand{0%{transform:translate(-50%,-50%) scale(.05) rotate(-20deg);opacity:0}18%{opacity:1}100%{transform:translate(-50%,-50%) scale(8) rotate(35deg);opacity:1}}
@keyframes water-bg{0%,65%{background:#080d18}100%{background:#0b1525}}
@keyframes label-fade{0%{opacity:0;transform:translateY(8px)}30%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.auth-card{animation:none}.water-transition,.water-transition:before,.water-transition:after,.water-wave,.water-label{animation-duration:.2s}}
</style>
</head>
<body class="auth-page">
{% if transition %}
<div class="water-transition" role="status" aria-label="ورود موفق، در حال بارگذاری">
<span class="water-wave"></span><span class="water-label">ورود موفق · در حال بارگذاری CryptoPulse</span>
</div>
<script>
window.setTimeout(() => { window.location.replace({{ url_for('index')|tojson }}); }, 1050);
</script>
{% else %}
<main class="auth-card">
<div class="brand-mark">₿</div>
<p class="eyebrow">LOCAL MARKET RESEARCH</p>
<h1>ورود به CryptoPulse</h1>
<p class="muted">برای ادامه، رمز عبور پنل را وارد کن.</p>
{% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
<form method="post" id="login-form">
<label for="password">رمز عبور پنل</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
<button class="primary-button" type="submit">ورود امن <span>←</span></button>
</form>
<p class="footnote">رمز عبور به‌صورت هش‌شده در حافظه برنامه نگهداری می‌شود.</p>
</main>
{% endif %}
</body>
</html>
