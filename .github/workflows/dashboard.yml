name: CryptoPulse dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptopulse-public-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      PASS: ${{ secrets.PASS }}
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt --retries 4 --timeout 60

      - name: Start dashboard and secure tunnel
        id: dashboard_start
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PASS) -or $env:PASS.Length -lt 10) {
            throw "Repository secret PASS is missing or shorter than 10 characters. Add it in Settings > Secrets and variables > Actions."
          }

          # Ensure Python can import repository packages regardless of how the script is launched.
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          Write-Host "Repository root added to PYTHONPATH: $env:GITHUB_WORKSPACE"

          $dashboardOut = Join-Path $env:RUNNER_TEMP "cryptopulse-dashboard.out.log"
          $dashboardErr = Join-Path $env:RUNNER_TEMP "cryptopulse-dashboard.err.log"
          $tunnelOut = Join-Path $env:RUNNER_TEMP "cryptopulse-tunnel.out.log"
          $tunnelErr = Join-Path $env:RUNNER_TEMP "cryptopulse-tunnel.err.log"

          $dashboard = Start-Process -FilePath "python" -ArgumentList @("-u", "$env:GITHUB_WORKSPACE/scripts/serve_dashboard.py") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $dashboardOut -RedirectStandardError $dashboardErr
          Write-Host "Started CryptoPulse dashboard process (PID $($dashboard.Id))."

          $healthy = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/login" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            if ($dashboard.HasExited) {
              Write-Host "Dashboard process exited. stdout log:"
              if (Test-Path $dashboardOut) { Get-Content $dashboardOut }
              Write-Host "Dashboard stderr log:"
              if (Test-Path $dashboardErr) { Get-Content $dashboardErr }
              Write-Host "Python executable and repository contents:"
              python --version
              Get-ChildItem $env:GITHUB_WORKSPACE | Select-Object Name, Mode
              throw "CryptoPulse dashboard exited before becoming healthy."
            }
          }
          if (-not $healthy) { throw "CryptoPulse dashboard did not become healthy on port 8080." }

          $cloudflared = Join-Path $env:RUNNER_TEMP "cloudflared.exe"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflared
          $tunnel = Start-Process -FilePath $cloudflared -ArgumentList @("tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:8080") -PassThru -RedirectStandardOutput $tunnelOut -RedirectStandardError $tunnelErr
          Write-Host "Started temporary Cloudflare Tunnel (PID $($tunnel.Id)). Waiting for its public URL."

          $publicUrl = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            foreach ($log in @($tunnelOut, $tunnelErr)) {
              if (Test-Path $log) {
                $contents = Get-Content $log -Raw -ErrorAction SilentlyContinue
                if ($contents -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                  $publicUrl = $Matches[0]
                  break
                }
              }
            }
            if ($publicUrl) { break }
            if ($tunnel.HasExited) {
              if (Test-Path $tunnelErr) { Get-Content $tunnelErr }
              throw "Cloudflare Tunnel exited before creating a public URL."
            }
          }
          if (-not $publicUrl) {
            if (Test-Path $tunnelOut) { Get-Content $tunnelOut }
            if (Test-Path $tunnelErr) { Get-Content $tunnelErr }
            throw "Could not obtain a Cloudflare quick-tunnel URL."
          }

          "## CryptoPulse dashboard" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Dashboard link (temporary): $publicUrl" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "This link works only while this workflow run and tunnel remain active. The URL is not a permanent hosting address." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Save process IDs so the long-running keepalive step can monitor them.
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "cryptopulse-dashboard.pid") -Value $dashboard.Id -Encoding ASCII
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "cryptopulse-tunnel.pid") -Value $tunnel.Id -Encoding ASCII
          "public_url=$publicUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "CryptoPulse dashboard link (temporary): $publicUrl"
          Write-Host "Do not share the login password. The dashboard stays available only while this workflow run is active."

      - name: Keep dashboard and tunnel alive
        shell: pwsh
        run: |
          $dashboardPidFile = Join-Path $env:RUNNER_TEMP "cryptopulse-dashboard.pid"
          $tunnelPidFile = Join-Path $env:RUNNER_TEMP "cryptopulse-tunnel.pid"
          if (-not (Test-Path $dashboardPidFile) -or -not (Test-Path $tunnelPidFile)) {
            throw "Dashboard or tunnel process ID file is missing."
          }
          $dashboardPid = [int](Get-Content $dashboardPidFile -Raw).Trim()
          $tunnelPid = [int](Get-Content $tunnelPidFile -Raw).Trim()
          $dashboardErr = Join-Path $env:RUNNER_TEMP "cryptopulse-dashboard.err.log"
          $tunnelErr = Join-Path $env:RUNNER_TEMP "cryptopulse-tunnel.err.log"
          Write-Host "Dashboard and tunnel are running. The public link was published in the previous step."
          $deadline = [DateTime]::UtcNow.AddMinutes(345)
          while ([DateTime]::UtcNow -lt $deadline) {
            if (-not (Get-Process -Id $dashboardPid -ErrorAction SilentlyContinue)) {
              if (Test-Path $dashboardErr) { Get-Content $dashboardErr }
              throw "CryptoPulse dashboard process stopped."
            }
            if (-not (Get-Process -Id $tunnelPid -ErrorAction SilentlyContinue)) {
              if (Test-Path $tunnelErr) { Get-Content $tunnelErr }
              throw "Cloudflare Tunnel process stopped."
            }
            Start-Sleep -Seconds 10
          }
          Write-Host "Temporary dashboard run reached its planned time limit."
