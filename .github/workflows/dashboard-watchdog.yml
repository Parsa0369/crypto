name: CryptoPulse dashboard watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  keep-dashboard-running:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start dashboard if no run is active
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/dashboard.yml/runs?branch=main&per_page=10")"

          if echo "$runs_json" | jq -e '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length > 0' >/dev/null; then
            echo "CryptoPulse dashboard workflow is already queued or running."
            exit 0
          fi

          echo "No active CryptoPulse dashboard run found. Dispatching a new run."
          status="$(curl --silent --show-error -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/dashboard.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$status" != "204" ]; then
            echo "Dispatch failed with HTTP $status:"
            cat /tmp/dispatch-response.json
            exit 1
          fi
          echo "A new CryptoPulse dashboard run has been queued."
