services:
  - type: web
    name: cryptopulse
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CRYPTOPULSE_SECRET_KEY
        generateValue: true
      - key: PASS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
